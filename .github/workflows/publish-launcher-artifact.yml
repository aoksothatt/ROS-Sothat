name: Publish ROS-Sothatt-Launcher-iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-launcher-artifact.yml'

permissions:
  actions: read
  contents: read

jobs:
  publish-launcher-artifact:
    name: Publish ROS-Sothatt-Launcher-iOS Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download Existing IPA from Build Run 43797644495
        id: download_step
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ROSSothatLauncher-unsigned-ipa
          run-id: 43797644495
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: launcher-artifact

      - name: Fallback Download via GitHub API (if needed)
        run: |
          set -euo pipefail
          if [ ! -f launcher-artifact/ROSSothatLauncher-unsigned.ipa ]; then
            echo "actions/download-artifact did not retrieve the file. Using direct GitHub API download..."
            mkdir -p launcher-artifact
            curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              https://api.github.com/repos/${{ github.repository }}/actions/artifacts/14194659188/zip \
              -o artifact.zip
            unzip -q artifact.zip -d launcher-artifact/
            rm -f artifact.zip
          fi

      - name: Verify IPA Integrity & Structure
        run: |
          set -euo pipefail
          ls -la launcher-artifact/
          IPA_PATH="launcher-artifact/ROSSothatLauncher-unsigned.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA file not found at $IPA_PATH"
            exit 1
          fi

          echo "=== File Details ==="
          ls -lh "$IPA_PATH"

          echo "=== SHA-256 Checksum ==="
          ACTUAL_SHA=$(sha256sum "$IPA_PATH" | awk '{print $1}')
          echo "Calculated SHA-256: $ACTUAL_SHA"
          EXPECTED_SHA="b14ec334e458cbd5497b5b07c0ed2d5f63fc5cb9021f9a0364377b26121590fa"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: SHA-256 mismatch! Expected $EXPECTED_SHA but got $ACTUAL_SHA"
            exit 1
          fi
          echo "SHA-256 verified successfully!"

          echo "=== ZIP & Payload Structure Check ==="
          unzip -l "$IPA_PATH" | grep "Payload/ROSSothatLauncher.app"

      - name: Upload ROS-Sothatt-Launcher-iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROS-Sothatt-Launcher-iOS
          path: launcher-artifact/ROSSothatLauncher-unsigned.ipa
          retention-days: 14
